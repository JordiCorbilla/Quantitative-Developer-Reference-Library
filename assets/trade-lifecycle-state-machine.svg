<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500" role="img" aria-labelledby="title desc">
  <title id="title">Trade lifecycle state machine</title>
  <desc id="desc">Generic trade lifecycle state machine from pre-trade through execution, booking, validation, confirmation, clearing or settlement, live events, maturity, closeout, and post-trade controls.</desc>
  <defs>
    <style>
      .bg{fill:#fbfcff}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#93c5fd}.green{fill:#f0fdf4;stroke:#86efac}.amber{fill:#fffbeb;stroke:#fcd34d}.red{fill:#fef2f2;stroke:#fca5a5}.title{font:bold 28px Arial,sans-serif;fill:#0f172a}.h{font:bold 14px Arial,sans-serif;fill:#0f172a}.txt{font:12px Arial,sans-serif;fill:#334155}.small{font:11px Arial,sans-serif;fill:#64748b}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#a)}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" width="1160" height="500"/>
  <text class="title" x="40" y="48">Generic Trade Lifecycle State Machine</text>
  <text class="txt" x="40" y="75">Pricing and risk should consume the correct trade state, not only the original economics.</text>
  <rect class="blue" x="40" y="125" width="120" height="78" rx="9"/><text class="h" x="62" y="154">Pre-trade</text><text class="txt" x="62" y="176">quote, limits</text>
  <rect class="box" x="205" y="125" width="120" height="78" rx="9"/><text class="h" x="228" y="154">Executed</text><text class="txt" x="228" y="176">fill, venue</text>
  <rect class="box" x="370" y="125" width="120" height="78" rx="9"/><text class="h" x="396" y="154">Booked</text><text class="txt" x="392" y="176">trade terms</text>
  <rect class="amber" x="535" y="125" width="120" height="78" rx="9"/><text class="h" x="560" y="154">Validated</text><text class="txt" x="558" y="176">static data</text>
  <rect class="green" x="700" y="125" width="120" height="78" rx="9"/><text class="h" x="724" y="154">Confirmed</text><text class="txt" x="724" y="176">matched terms</text>
  <rect class="box" x="865" y="125" width="120" height="78" rx="9"/><text class="h" x="892" y="154">Settled</text><text class="txt" x="890" y="176">cash/security</text>
  <rect class="green" x="1020" y="125" width="100" height="78" rx="9"/><text class="h" x="1042" y="154">Closed</text><text class="txt" x="1040" y="176">matured</text>
  <path class="arrow" d="M160 164H205"/><path class="arrow" d="M325 164H370"/><path class="arrow" d="M490 164H535"/><path class="arrow" d="M655 164H700"/><path class="arrow" d="M820 164H865"/><path class="arrow" d="M985 164H1020"/>
  <rect class="red" x="370" y="300" width="150" height="90" rx="9"/><text class="h" x="402" y="330">Exception</text><text class="txt" x="395" y="352">break, dispute, fail</text><text class="txt" x="395" y="372">owner and reason</text>
  <rect class="amber" x="590" y="300" width="160" height="90" rx="9"/><text class="h" x="618" y="330">Lifecycle Event</text><text class="txt" x="612" y="352">amend, fixing, reset</text><text class="txt" x="612" y="372">exercise, termination</text>
  <rect class="box" x="820" y="300" width="170" height="90" rx="9"/><text class="h" x="850" y="330">Controls</text><text class="txt" x="845" y="352">recon, PnL explain</text><text class="txt" x="845" y="372">reporting, audit</text>
  <path class="back" d="M595 203C585 250,520 265,455 300"/><path class="back" d="M760 203C760 250,725 275,670 300"/><path class="back" d="M925 203C925 250,915 275,905 300"/><path class="back" d="M520 345H590"/><path class="back" d="M750 345H820"/>
</svg>
