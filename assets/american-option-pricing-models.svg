<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="520" viewBox="0 0 1060 520" role="img" aria-labelledby="title desc">
  <title id="title">American option pricing model choices</title>
  <desc id="desc">Comparison of binomial tree, trinomial tree, finite difference, Longstaff-Schwartz Monte Carlo, Leisen-Reimer tree, and quadratic approximation methods for American option pricing.</desc>
  <defs>
    <style>
      .bg{fill:#fbfcff}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.tree{fill:#eff6ff;stroke:#93c5fd}.pde{fill:#f0fdf4;stroke:#86efac}.mc{fill:#fff7ed;stroke:#fdba74}.approx{fill:#fff1f2;stroke:#fda4af}.title{font:bold 26px Arial,sans-serif;fill:#0f172a}.h{font:bold 15px Arial,sans-serif;fill:#0f172a}.txt{font:12px Arial,sans-serif;fill:#334155}.small{font:11px Arial,sans-serif;fill:#475569}.line{stroke:#475569;stroke-width:2}.node{fill:#2563eb}
    </style>
  </defs>
  <rect class="bg" width="1060" height="520"/>
  <text class="title" x="40" y="52">American Option Pricing: Model Choice</text>
  <text class="small" x="40" y="76">American pricing is an optimal-stopping problem: value and exercise policy must be solved together.</text>

  <rect class="card tree" x="45" y="110" width="300" height="160" rx="8"/>
  <text class="h" x="70" y="142">Binomial / Trinomial Trees</text>
  <text class="txt" x="70" y="168">Backward induction with exercise</text>
  <text class="txt" x="70" y="186">check at each node.</text>
  <text class="txt" x="70" y="208">Trinomial trees add middle moves and</text>
  <text class="txt" x="70" y="226">often improve stability.</text>
  <line class="line" x1="260" y1="250" x2="310" y2="235"/><line class="line" x1="260" y1="250" x2="310" y2="260"/>
  <circle class="node" cx="260" cy="250" r="4"/><circle class="node" cx="310" cy="235" r="4"/><circle class="node" cx="310" cy="260" r="4"/>

  <rect class="card pde" x="380" y="110" width="300" height="160" rx="8"/>
  <text class="h" x="405" y="142">Finite Difference Methods</text>
  <text class="txt" x="405" y="168">Solve the pricing PDE on a</text>
  <text class="txt" x="405" y="186">stock-time grid.</text>
  <text class="txt" x="405" y="208">Early exercise is imposed as a</text>
  <text class="txt" x="405" y="226">free-boundary constraint.</text>
  <path d="M595 242H655M595 258H655M615 234V266M638 234V266" stroke="#475569" stroke-width="2"/>

  <rect class="card mc" x="715" y="110" width="300" height="160" rx="8"/>
  <text class="h" x="740" y="142">Longstaff-Schwartz Monte Carlo</text>
  <text class="txt" x="740" y="168">Estimate continuation value by regression</text>
  <text class="txt" x="740" y="186">on simulated paths.</text>
  <text class="txt" x="740" y="208">Useful for Bermudan and high-dimensional</text>
  <text class="txt" x="740" y="226">exercise features.</text>
  <circle class="node" cx="910" cy="255" r="4"/><circle class="node" cx="945" cy="242" r="4"/><circle class="node" cx="970" cy="258" r="4"/><line class="line" x1="900" y1="263" x2="990" y2="232"/>

  <rect class="card tree" x="170" y="300" width="300" height="145" rx="8"/>
  <text class="h" x="195" y="332">Leisen-Reimer Tree</text>
  <text class="txt" x="195" y="358">Improved lattice convergence for vanilla options.</text>
  <text class="txt" x="195" y="380">Useful when step count needs to stay modest.</text>

  <rect class="card approx" x="590" y="300" width="300" height="145" rx="8"/>
  <text class="h" x="615" y="332">Quadratic Approximation</text>
  <text class="txt" x="615" y="358">Analytical-style approximations such as</text>
  <text class="txt" x="615" y="376">Barone-Adesi Whaley.</text>
  <text class="txt" x="615" y="402">Fast, but must be benchmarked against</text>
  <text class="txt" x="615" y="420">trees or PDEs.</text>

  <rect class="card" x="115" y="460" width="830" height="45" rx="8"/>
  <text class="h" x="145" y="488">Choose by exercise style, dimensionality, dividend/carry treatment, accuracy target, and runtime budget.</text>
</svg>
