<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Correlation versus cointegration</title>
  <desc id="desc">Two schematic panels compare highly correlated trending prices whose fitted spread drifts with nonstationary prices whose fitted linear combination oscillates around a stable mean.</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:bold 28px Arial,sans-serif;fill:#172033}.subtitle{font:15px Arial,sans-serif;fill:#43536a}.h{font:bold 20px Arial,sans-serif;fill:#172033}.body{font:14px Arial,sans-serif;fill:#34445b}.small{font:12px Arial,sans-serif;fill:#52637a}.formula{font:bold 16px Arial,sans-serif;fill:#172033}.axis{stroke:#64748b;stroke-width:1.5}.grid{stroke:#e2e8f0;stroke-width:1}.series1{fill:none;stroke:#2563eb;stroke-width:4}.series2{fill:none;stroke:#d97706;stroke-width:4}.drift{fill:none;stroke:#dc2626;stroke-width:4}.stable{fill:none;stroke:#16835b;stroke-width:4}.zero{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6}.band{fill:#dcfce7;opacity:.65}.warn{fill:#fff1f2;stroke:#fda4af}.good{fill:#ecfdf5;stroke:#86efac}.label{font:bold 13px Arial,sans-serif;fill:#172033}
    </style>
  </defs>
  <rect class="bg" width="1200" height="650"/>
  <text class="title" x="45" y="48">Correlation Is Not Cointegration</text>
  <text class="subtitle" x="45" y="76">Correlation describes co-movement; cointegration asks whether a fitted combination of price levels is stationary.</text>

  <rect class="panel" x="40" y="105" width="540" height="500" rx="10"/>
  <text class="h" x="65" y="140">High correlation, drifting relationship</text>
  <text class="body" x="65" y="166">Returns can move together while the level relationship keeps separating.</text>
  <line class="axis" x1="85" y1="345" x2="540" y2="345"/>
  <line class="axis" x1="85" y1="345" x2="85" y2="205"/>
  <line class="grid" x1="85" y1="275" x2="540" y2="275"/>
  <path class="series1" d="M85 325 C145 310 180 292 225 275 C280 255 315 232 370 215 C425 198 472 178 540 155"/>
  <path class="series2" d="M85 330 C145 315 180 302 225 287 C280 271 315 251 370 240 C425 229 472 219 540 205"/>
  <text class="label" x="512" y="146">Y</text>
  <text class="label" x="512" y="225">X</text>
  <text class="small" x="90" y="365">time</text>

  <text class="formula" x="65" y="405">corr(Delta X, Delta Y) can be high</text>
  <text class="small" x="65" y="432">Fitted residual</text>
  <line class="axis" x1="85" y1="535" x2="540" y2="535"/>
  <line class="zero" x1="85" y1="490" x2="540" y2="490"/>
  <path class="drift" d="M85 505 C145 500 190 487 240 474 C300 457 350 445 410 420 C462 399 500 384 540 365"/>
  <text class="small" x="92" y="484">0</text>
  <rect class="warn" x="65" y="555" width="490" height="34" rx="6"/>
  <text class="body" x="82" y="578">No stable residual: an extreme z-score can simply be trend continuation.</text>

  <rect class="panel" x="620" y="105" width="540" height="500" rx="10"/>
  <text class="h" x="645" y="140">Cointegration candidate, stable residual</text>
  <text class="body" x="645" y="166">The prices can trend, yet a fitted linear combination remains bounded.</text>
  <line class="axis" x1="665" y1="345" x2="1120" y2="345"/>
  <line class="axis" x1="665" y1="345" x2="665" y2="205"/>
  <line class="grid" x1="665" y1="275" x2="1120" y2="275"/>
  <path class="series1" d="M665 325 C720 311 765 286 815 276 C865 267 907 231 960 221 C1012 212 1062 173 1120 157"/>
  <path class="series2" d="M665 330 C720 302 765 301 815 270 C865 247 907 248 960 215 C1012 193 1062 193 1120 151"/>
  <text class="label" x="1094" y="143">Y</text>
  <text class="label" x="1094" y="181">X</text>
  <text class="small" x="670" y="365">time</text>

  <text class="formula" x="645" y="405">s_t = Y_t - alpha - beta X_t is I(0)</text>
  <text class="small" x="645" y="432">Fitted residual</text>
  <rect class="band" x="665" y="462" width="455" height="56" rx="4"/>
  <line class="axis" x1="665" y1="535" x2="1120" y2="535"/>
  <line class="zero" x1="665" y1="490" x2="1120" y2="490"/>
  <path class="stable" d="M665 492 C700 458 735 462 770 491 C807 521 840 518 875 487 C910 459 946 466 980 493 C1016 520 1052 514 1082 487 C1098 473 1110 475 1120 483"/>
  <text class="small" x="672" y="484">0</text>
  <rect class="good" x="645" y="555" width="490" height="34" rx="6"/>
  <text class="body" x="662" y="578">Stationarity is evidence for a trade hypothesis, never a guarantee of convergence.</text>

  <text class="small" x="45" y="630">Schematic only. A real test must declare price adjustments, integration order, deterministic terms, lags, sample window, and residual critical values.</text>
</svg>
