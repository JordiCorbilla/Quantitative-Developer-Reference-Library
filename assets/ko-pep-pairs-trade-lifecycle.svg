<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Coca-Cola and PepsiCo pairs-trade lifecycle</title>
  <desc id="desc">Synthetic normalized KO and PEP prices are aligned above a spread z-score. The z-score reaches positive two, triggering a short-KO long-PEP trade, then returns to zero for a convergence exit without reaching the stop.</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:bold 27px Arial,sans-serif;fill:#172033}.subtitle{font:15px Arial,sans-serif;fill:#43536a}.h{font:bold 17px Arial,sans-serif;fill:#172033}.body{font:14px Arial,sans-serif;fill:#34445b}.small{font:12px Arial,sans-serif;fill:#52637a}.label{font:bold 13px Arial,sans-serif;fill:#172033}.axis{stroke:#64748b;stroke-width:1.5}.grid{stroke:#e2e8f0;stroke-width:1}.ko{fill:none;stroke:#2563eb;stroke-width:4}.pep{fill:none;stroke:#d97706;stroke-width:4}.z{fill:none;stroke:#7c3aed;stroke-width:4}.threshold{stroke:#64748b;stroke-width:1.5;stroke-dasharray:7 5}.stop{stroke:#dc2626;stroke-width:2;stroke-dasharray:3 5}.event{stroke:#172033;stroke-width:2;stroke-dasharray:6 5}.exitband{fill:#dcfce7;opacity:.72}.entrydot{fill:#fff;stroke:#7c3aed;stroke-width:4}.exitdot{fill:#16835b;stroke:#fff;stroke-width:3}.box1{fill:#eff6ff;stroke:#93c5fd}.box2{fill:#fff7ed;stroke:#fdba74}.box3{fill:#ecfdf5;stroke:#86efac}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="45" y="45">KO / PEP Mean-Reversion Trade — Synthetic Teaching Path</text>
  <text class="subtitle" x="45" y="72">The fitted model is frozen before T0. The pair is illustrative, not a claim of current cointegration or a trading recommendation.</text>

  <rect class="panel" x="40" y="95" width="1120" height="250" rx="10"/>
  <text class="h" x="65" y="125">Normalized prices (T-2 = 100)</text>
  <line class="axis" x1="90" y1="310" x2="1110" y2="310"/>
  <line class="axis" x1="90" y1="310" x2="90" y2="150"/>
  <line class="grid" x1="90" y1="240" x2="1110" y2="240"/>
  <path class="ko" d="M100 300 L290 248 L480 196 L670 185 L860 227 L1050 269"/>
  <path class="pep" d="M100 300 L290 289 L480 300 L670 289 L860 278 L1050 267"/>
  <text class="label" x="675" y="176">KO</text>
  <text class="label" x="1060" y="262">PEP</text>
  <line class="event" x1="480" y1="145" x2="480" y2="610"/>
  <line class="event" x1="1050" y1="145" x2="1050" y2="610"/>
  <text class="label" x="493" y="160">Enter</text>
  <text class="label" x="1062" y="160">Exit</text>
  <text class="small" x="90" y="330">T-2</text>
  <text class="small" x="280" y="330">T-1</text>
  <text class="small" x="470" y="330">T0</text>
  <text class="small" x="655" y="330">T+1</text>
  <text class="small" x="845" y="330">T+2</text>
  <text class="small" x="1034" y="330">T+3</text>

  <rect class="panel" x="40" y="365" width="1120" height="245" rx="10"/>
  <text class="h" x="65" y="395">Frozen spread z-score and stateful policy</text>
  <rect class="exitband" x="90" y="480" width="1020" height="30" rx="3"/>
  <line class="stop" x1="90" y1="405" x2="1110" y2="405"/>
  <line class="threshold" x1="90" y1="435" x2="1110" y2="435"/>
  <line class="threshold" x1="90" y1="495" x2="1110" y2="495"/>
  <line class="threshold" x1="90" y1="555" x2="1110" y2="555"/>
  <line class="stop" x1="90" y1="600" x2="1110" y2="600"/>
  <line class="axis" x1="90" y1="600" x2="90" y2="405"/>
  <path class="z" d="M100 495 L290 471 L480 435 L670 435 L860 465 L1050 495"/>
  <circle class="entrydot" cx="480" cy="435" r="8"/>
  <circle class="exitdot" cx="1050" cy="495" r="8"/>
  <text class="small" x="98" y="420">+3.5 stop/review — not reached</text>
  <text class="small" x="98" y="450">+2.0 short-spread entry</text>
  <text class="small" x="98" y="490">+0.5 to -0.5 convergence-exit zone</text>
  <text class="small" x="98" y="550">-2.0 long-spread entry</text>
  <text class="small" x="98" y="593">-3.5 stop/review</text>
  <text class="label" x="495" y="425">short KO / long 0.40 PEP</text>
  <text class="label" x="930" y="520">close near mean</text>

  <rect class="box1" x="40" y="635" width="350" height="95" rx="8"/>
  <text class="h" x="62" y="665">Frozen relation</text>
  <text class="body" x="62" y="691">KO = 3.00 + 0.40 PEP + spread</text>
  <text class="body" x="62" y="714">mean = 0; spread sigma = 1</text>

  <rect class="box2" x="425" y="635" width="350" height="95" rx="8"/>
  <text class="h" x="447" y="665">Position at T0</text>
  <text class="body" x="447" y="691">Short 1,000 KO; long 400 PEP</text>
  <text class="body" x="447" y="714">USD 133,000 gross; not dollar neutral</text>

  <rect class="box3" x="810" y="635" width="350" height="95" rx="8"/>
  <text class="h" x="832" y="665">Reconciled exit at T+3</text>
  <text class="body" x="832" y="691">Gross PnL USD 2,000; costs USD 150</text>
  <text class="body" x="832" y="714">Net PnL USD 1,850</text>

  <text class="small" x="45" y="750">Six observations illustrate mechanics only. Cointegration and all parameters require a separate prior training sample and point-in-time validation.</text>
</svg>
