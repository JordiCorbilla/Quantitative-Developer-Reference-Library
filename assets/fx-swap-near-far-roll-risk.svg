<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">FX swap near and far leg with roll risk</title>
  <desc id="desc">Diagram showing spot near leg, forward far leg, forward points, and roll risk drivers for an FX swap.</desc>
  <rect width="920" height="420" fill="#f8fafc"/>
  <text x="460" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">FX Swap: Near Leg, Far Leg, And Roll Risk</text>
  <text x="460" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">An FX swap exchanges currencies now and reverses the exchange later at a locked forward rate.</text>

  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect x="45" y="105" width="170" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">Party A</text>
  <text x="130" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e40af">needs USD today</text>

  <rect x="705" y="105" width="170" height="78" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="790" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7c2d12">Party B</text>
  <text x="790" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9a3412">has USD today</text>

  <text x="460" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Near leg: spot date</text>
  <path d="M225 136 H690" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="458" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e40af">sell EUR / buy USD at spot</text>
  <path d="M690 164 H225" stroke="#c2410c" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text x="458" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9a3412">buy EUR / sell USD at spot</text>

  <text x="460" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Far leg: maturity date</text>
  <path d="M225 248 H690" stroke="#c2410c" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrowOrange)"/>
  <text x="458" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9a3412">buy EUR / sell USD at forward</text>
  <path d="M690 276 H225" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrowBlue)"/>
  <text x="458" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e40af">sell EUR / buy USD at forward</text>

  <rect x="70" y="320" width="210" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="175" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Forward points</text>
  <text x="175" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">rate differential + basis/liquidity</text>

  <rect x="355" y="320" width="210" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="460" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Roll risk</text>
  <text x="460" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">new points may widen at rollover</text>

  <rect x="640" y="320" width="210" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="745" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Collateral and limits</text>
  <text x="745" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">CSA, VM, IM, counterparty lines</text>
</svg>
