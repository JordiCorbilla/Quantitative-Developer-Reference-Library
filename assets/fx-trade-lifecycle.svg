<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">FX trade lifecycle from quote to settlement</title>
  <desc id="desc">Original diagram showing the lifecycle of an FX trade from execution through confirmation, settlement, CLS payment-versus-payment, and post-trade control.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5f8f"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 30px Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 15px Arial, sans-serif; fill: #4b6175; }
      .box { fill: #ffffff; stroke: #9db6cc; stroke-width: 2; rx: 14; }
      .stage { font: 700 16px Arial, sans-serif; fill: #17324d; }
      .body { font: 13px Arial, sans-serif; fill: #2d3e50; }
      .small { font: 12px Arial, sans-serif; fill: #50697f; }
      .pill { fill: #e9f2f8; stroke: #9db6cc; stroke-width: 1.5; rx: 10; }
      .risk { fill: #fff4e5; stroke: #d99b3d; stroke-width: 1.5; rx: 10; }
      .control { fill: #edf7ef; stroke: #71a579; stroke-width: 1.5; rx: 10; }
      .line { stroke: #2f5f8f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .softline { stroke: #9db6cc; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
      .money { fill: #2e7d6f; }
      .warn { fill: #b4612b; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="640"/>
  <text class="title" x="550" y="42" text-anchor="middle">Life Of An FX Trade: From Quote To Cash</text>
  <text class="subtitle" x="550" y="68" text-anchor="middle">A trade is not finished at execution. It still has to be captured, confirmed, funded, settled, reconciled, and explained.</text>
  <rect class="box" x="45" y="110" width="165" height="160"/>
  <text class="stage" x="128" y="136" text-anchor="middle">1. Execution</text>
  <text class="body" x="64" y="166">Trader or client accepts</text>
  <text class="body" x="64" y="186">bid/ask quote.</text>
  <text class="body" x="64" y="213">Trade defines pair, side,</text>
  <text class="body" x="64" y="233">notional, price, value</text>
  <text class="body" x="64" y="253">date.</text>
  <rect class="box" x="260" y="110" width="165" height="160"/>
  <text class="stage" x="343" y="136" text-anchor="middle">2. Capture</text>
  <text class="body" x="279" y="166">Front-office booking</text>
  <text class="body" x="279" y="186">creates the system</text>
  <text class="body" x="279" y="206">trade.</text>
  <text class="body" x="279" y="233">Controls check limits,</text>
  <text class="body" x="279" y="253">currency, and calendars.</text>
  <rect class="box" x="475" y="110" width="165" height="160"/>
  <text class="stage" x="558" y="136" text-anchor="middle">3. Confirmation</text>
  <text class="body" x="494" y="166">Counterparties agree</text>
  <text class="body" x="494" y="186">economic terms.</text>
  <text class="body" x="494" y="213">Breaks must be fixed</text>
  <text class="body" x="494" y="233">before settlement risk</text>
  <text class="body" x="494" y="253">rises.</text>
  <rect class="box" x="690" y="110" width="165" height="160"/>
  <text class="stage" x="773" y="136" text-anchor="middle">4. Settlement</text>
  <text class="body" x="709" y="166">Cash instructions,</text>
  <text class="body" x="709" y="186">funding, and nostro</text>
  <text class="body" x="709" y="206">balances are set.</text>
  <text class="body" x="709" y="233">CLS/PvP can reduce</text>
  <text class="body" x="709" y="253">principal settlement risk.</text>
  <rect class="box" x="905" y="110" width="150" height="160"/>
  <text class="stage" x="980" y="136" text-anchor="middle">5. Post-Trade</text>
  <text class="body" x="923" y="166">Reconcile cash,</text>
  <text class="body" x="923" y="186">report, explain PnL,</text>
  <text class="body" x="923" y="206">and archive.</text>
  <text class="body" x="923" y="233">Lifecycle events feed</text>
  <text class="body" x="923" y="253">risk and controls.</text>
  <path class="line" d="M 210 179 L 255 179"/>
  <path class="line" d="M 425 179 L 470 179"/>
  <path class="line" d="M 640 179 L 685 179"/>
  <path class="line" d="M 855 179 L 900 179"/>
  <rect class="pill" x="70" y="315" width="250" height="130"/>
  <text class="stage" x="195" y="343" text-anchor="middle">Bid, Ask, And Spread</text>
  <text class="body" x="91" y="374">Buyer usually pays the ask.</text>
  <text class="body" x="91" y="396">Seller usually hits the bid.</text>
  <text class="small" x="91" y="418">Spread is an execution cost</text>
  <text class="small" x="91" y="436">and a liquidity signal.</text>
  <rect class="pill" x="425" y="315" width="250" height="130"/>
  <text class="stage" x="550" y="343" text-anchor="middle">Market Structure</text>
  <text class="body" x="446" y="374">Client, dealer, venue, broker,</text>
  <text class="body" x="446" y="396">prime broker, custodian, and CLS</text>
  <text class="small" x="446" y="424">may all touch the same economic trade.</text>
  <rect class="pill" x="780" y="315" width="250" height="130"/>
  <text class="stage" x="905" y="343" text-anchor="middle">Cash Movement</text>
  <text class="body" x="801" y="374">One currency is paid and another</text>
  <text class="body" x="801" y="396">is received on the value date.</text>
  <text class="small" x="801" y="418">Settlement fails become operational</text>
  <text class="small" x="801" y="436">and credit risk.</text>
  <path class="softline" d="M 195 315 C 210 280, 345 280, 343 270"/>
  <path class="softline" d="M 550 315 C 570 285, 760 285, 773 270"/>
  <path class="softline" d="M 905 315 C 920 285, 975 285, 980 270"/>
  <rect class="risk" x="80" y="480" width="290" height="125"/>
  <text class="stage" x="225" y="510" text-anchor="middle">Where The Trade Can Break</text>
  <text class="body" x="101" y="540">Wrong pair orientation, stale quote,</text>
  <text class="body" x="101" y="562">bad value date, failed confirmation,</text>
  <text class="body" x="101" y="584">insufficient funding, settlement fail.</text>
  <rect class="control" x="405" y="480" width="290" height="125"/>
  <text class="stage" x="550" y="510" text-anchor="middle">Controls That Matter</text>
  <text class="body" x="426" y="540">Trade validation, limits, confirmations,</text>
  <text class="body" x="426" y="562">payment matching, nostro reconciliation,</text>
  <text class="body" x="426" y="584">PnL explain and exception workflow.</text>
  <rect class="risk" x="730" y="480" width="290" height="125"/>
  <text class="stage" x="875" y="510" text-anchor="middle">Quant Developer Takeaway</text>
  <text class="body" x="751" y="540">A pricing object without lifecycle state</text>
  <text class="body" x="751" y="562">is incomplete. Dates, cashflows, booking</text>
  <text class="body" x="751" y="584">status, and settlement status affect risk.</text>
</svg>
