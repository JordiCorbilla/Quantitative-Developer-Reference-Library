<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Statistical arbitrage research-to-trade workflow</title>
  <desc id="desc">An original workflow diagram showing the process from investable universe and point-in-time data through hedge estimation, spread signal, portfolio constraints, execution, and monitoring.</desc>
  <style>
    .title { font: 700 28px Arial, sans-serif; fill: #172033; }
    .subtitle { font: 400 16px Arial, sans-serif; fill: #43536a; }
    .step { font: 700 17px Arial, sans-serif; fill: #172033; }
    .body { font: 400 14px Arial, sans-serif; fill: #34445b; }
    .note { font: 700 14px Arial, sans-serif; fill: #ffffff; }
  </style>
  <rect width="1200" height="570" fill="#f7f9fc"/>
  <text x="60" y="60" class="title">Statistical Arbitrage: From Relationship Hypothesis to Live Portfolio</text>
  <text x="60" y="90" class="subtitle">Every stage must be point-in-time, cost-aware, and able to invalidate the trade rather than force it.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="60" y="145" width="235" height="120" rx="8" fill="#e8f0fb" stroke="#4c78a8" stroke-width="2"/>
  <text x="84" y="183" class="step">1. Investable universe</text>
  <text x="84" y="210" class="body">Point-in-time membership</text>
  <text x="84" y="233" class="body">Liquidity, borrow, events</text>
  <path d="M305 205 L350 205" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="360" y="145" width="235" height="120" rx="8" fill="#eaf7f2" stroke="#3c8c68" stroke-width="2"/>
  <text x="384" y="183" class="step">2. Estimate relationship</text>
  <text x="384" y="210" class="body">Hedge ratio and residual</text>
  <text x="384" y="233" class="body">Stationarity and stability</text>
  <path d="M605 205 L650 205" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="660" y="145" width="235" height="120" rx="8" fill="#fff3df" stroke="#bd7627" stroke-width="2"/>
  <text x="684" y="183" class="step">3. Form signal</text>
  <text x="684" y="210" class="body">Rolling mean and volatility</text>
  <text x="684" y="233" class="body">z-score, entry, exit, stop</text>
  <path d="M905 205 L950 205" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="960" y="145" width="180" height="120" rx="8" fill="#fbeaf0" stroke="#ad4f6c" stroke-width="2"/>
  <text x="984" y="183" class="step">4. Constrain</text>
  <text x="984" y="210" class="body">Risk, cost, capacity</text>
  <text x="984" y="233" class="body">and borrow checks</text>

  <path d="M1050 285 L1050 335 L600 335 L600 365" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="455" y="375" width="290" height="105" rx="8" fill="#e9f0ff" stroke="#596faa" stroke-width="2"/>
  <text x="480" y="414" class="step">5. Execute and account</text>
  <text x="480" y="441" class="body">Orders, fills, borrow, financing,</text>
  <text x="480" y="464" class="body">corporate actions, leg-level PnL</text>
  <path d="M745 427 L845 427" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="855" y="375" width="285" height="105" rx="8" fill="#f2ecfa" stroke="#7651a3" stroke-width="2"/>
  <text x="880" y="414" class="step">6. Monitor or retire</text>
  <text x="880" y="441" class="body">Model break, factor drift,</text>
  <text x="880" y="464" class="body">liquidity, borrow, capacity</text>
  <path d="M998 480 L998 525 L180 525 L180 265" fill="none" stroke="#ad4f6c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="245" y="492" width="500" height="48" rx="8" fill="#ad4f6c"/>
  <text x="268" y="522" class="note">Invalidation is a valid outcome: do not force mean reversion.</text>
</svg>
