<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="yield-title yield-desc">
  <title id="yield-title">Yield-curve interpolation and implied-forward impact</title>
  <desc id="yield-desc">An original two-panel diagram comparing linear zero-rate and log-linear discount-factor interpolation on synthetic curve nodes. It shows exact off-node values at 7.3 years, the different implied forward shapes between five and ten years, the distinction between interpolation and fitting, and a validation workflow.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}.ink{fill:#0f172a}.muted{fill:#475569}.quiet{fill:#64748b}.title{font:700 30px Arial,sans-serif}.subtitle{font:15px Arial,sans-serif}.h{font:700 17px Arial,sans-serif}.body{font:14px Arial,sans-serif}.small{font:12px Arial,sans-serif}.metric{font:700 18px Arial,sans-serif}.axis{stroke:#64748b;stroke-width:1.5}.grid{stroke:#e2e8f0;stroke-width:1}.blue{stroke:#2563eb;fill:none;stroke-width:3}.orange{stroke:#d97706;fill:none;stroke-width:3;stroke-dasharray:9 6}.teal-fill{fill:#ecfeff;stroke:#5eead4;stroke-width:1.5}.blue-fill{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.amber-fill{fill:#fffbeb;stroke:#fbbf24;stroke-width:1.5}.slate-fill{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.5}.node{fill:#ffffff;stroke:#0f172a;stroke-width:2}.target{stroke:#7c3aed;stroke-width:2;stroke-dasharray:5 5}.purple{fill:#6d28d9}.arrow{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#yield-arrow)}</style>
    <marker id="yield-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="780"/>
  <text class="title ink" x="44" y="50">Yield-curve interpolation changes the off-node contract</text>
  <text class="subtitle muted" x="44" y="76">Synthetic continuously compounded zero rates · schematic curve separation · exact 7.3Y values shown explicitly</text>

  <rect class="panel" x="36" y="98" width="760" height="396" rx="14"/>
  <text class="h ink" x="62" y="130">A. Same market nodes, two exact interpolators</text>
  <text class="small quiet" x="62" y="150">The lines meet at every observed node; the between-node separation is exaggerated for legibility.</text>

  <line class="grid" x1="112" y1="188" x2="742" y2="188"/>
  <line class="grid" x1="112" y1="238" x2="742" y2="238"/>
  <line class="grid" x1="112" y1="288" x2="742" y2="288"/>
  <line class="grid" x1="112" y1="338" x2="742" y2="338"/>
  <line class="axis" x1="112" y1="350" x2="748" y2="350"/>
  <line class="axis" x1="112" y1="170" x2="112" y2="350"/>
  <text class="small quiet" x="67" y="192">3.9%</text>
  <text class="small quiet" x="67" y="242">3.7%</text>
  <text class="small quiet" x="67" y="292">3.5%</text>
  <text class="small quiet" x="67" y="342">3.3%</text>
  <text class="small quiet" x="98" y="374">1</text>
  <text class="small quiet" x="128" y="374">2</text>
  <text class="small quiet" x="205" y="374">5</text>
  <text class="small quiet" x="321" y="374">10</text>
  <text class="small quiet" x="695" y="374">30</text>
  <text class="small quiet" x="632" y="397">Maturity (years)</text>
  <text class="small quiet" transform="translate(50 312) rotate(-90)">Zero rate</text>

  <path class="blue" d="M104 213 L136 250 L214 313 L332 275 L708 200"/>
  <path class="orange" d="M104 213 C118 230 126 241 136 250 C159 278 184 304 214 313 C252 318 286 291 332 275 C462 240 585 213 708 200"/>
  <circle class="node" cx="104" cy="213" r="5"/>
  <circle class="node" cx="136" cy="250" r="5"/>
  <circle class="node" cx="214" cy="313" r="5"/>
  <circle class="node" cx="332" cy="275" r="5"/>
  <circle class="node" cx="708" cy="200" r="5"/>

  <line class="target" x1="268" y1="178" x2="268" y2="350"/>
  <text class="small purple" x="248" y="171">7.3Y</text>
  <circle cx="268" cy="296" r="5" fill="#2563eb"/>
  <circle cx="268" cy="286" r="5" fill="#d97706"/>
  <path class="blue" d="M478 177h38"/>
  <text class="small ink" x="524" y="181">linear zero rate</text>
  <path class="orange" d="M478 203h38"/>
  <text class="small ink" x="524" y="207">log-linear discount factor</text>

  <rect class="blue-fill" x="442" y="236" width="280" height="92" rx="10"/>
  <text class="h ink" x="460" y="261">Exact 7.3Y comparison</text>
  <text class="body ink" x="460" y="285">Linear zero: z = 3.469%, P = 0.776284</text>
  <text class="body ink" x="460" y="307">Log-linear DF: z = 3.495%, P = 0.774839</text>
  <text class="small muted" x="460" y="324">Off-node zero-rate gap: 2.55 basis points</text>

  <rect class="panel" x="36" y="514" width="760" height="224" rx="14"/>
  <text class="h ink" x="62" y="547">B. The selected variable determines the implied forward shape</text>
  <text class="small quiet" x="62" y="568">Exact behavior on the 5Y–10Y interval of the worked example</text>
  <line class="grid" x1="112" y1="610" x2="742" y2="610"/>
  <line class="grid" x1="112" y1="650" x2="742" y2="650"/>
  <line class="grid" x1="112" y1="690" x2="742" y2="690"/>
  <line class="axis" x1="112" y1="704" x2="748" y2="704"/>
  <line class="axis" x1="112" y1="592" x2="112" y2="704"/>
  <text class="small quiet" x="70" y="614">3.9%</text>
  <text class="small quiet" x="70" y="654">3.7%</text>
  <text class="small quiet" x="70" y="694">3.5%</text>
  <text class="small quiet" x="104" y="724">5Y</text>
  <text class="small quiet" x="720" y="724">10Y</text>
  <path class="blue" d="M112 680 L742 600"/>
  <path class="orange" d="M112 650 L742 650"/>
  <line class="target" x1="402" y1="592" x2="402" y2="704"/>
  <circle cx="402" cy="643" r="5" fill="#2563eb"/>
  <circle cx="402" cy="650" r="5" fill="#d97706"/>
  <text class="small ink" x="431" y="622">linear-zero forward varies: 3.688% at 7.3Y</text>
  <text class="small ink" x="431" y="672">log-linear-DF forward is constant: 3.700%</text>

  <rect class="panel" x="816" y="98" width="348" height="174" rx="14"/>
  <text class="h ink" x="840" y="130">Interpolation ≠ fitting</text>
  <rect class="teal-fill" x="840" y="150" width="142" height="92" rx="9"/>
  <text class="body ink" x="857" y="175">Interpolation</text>
  <text class="small muted" x="857" y="198">Exact in the</text>
  <text class="small muted" x="857" y="216">selected node variable</text>
  <rect class="amber-fill" x="998" y="150" width="142" height="92" rx="9"/>
  <text class="body ink" x="1015" y="175">Curve fitting</text>
  <text class="small muted" x="1015" y="198">Smooth global model</text>
  <text class="small muted" x="1015" y="216">with quote residuals</text>

  <rect class="panel" x="816" y="292" width="348" height="202" rx="14"/>
  <text class="h ink" x="840" y="324">Representation comes first</text>
  <rect class="slate-fill" x="840" y="344" width="300" height="54" rx="9"/>
  <text class="body ink" x="855" y="367">P(0,T) = exp[−z(T)T]</text>
  <text class="small muted" x="855" y="386">positive discount factor from a finite zero rate</text>
  <rect class="slate-fill" x="840" y="414" width="300" height="54" rx="9"/>
  <text class="body ink" x="855" y="437">f(0,T) = −∂ log P(0,T) / ∂T</text>
  <text class="small muted" x="855" y="456">a smooth input space can create a jump here</text>

  <rect class="panel" x="816" y="514" width="348" height="224" rx="14"/>
  <text class="h ink" x="840" y="547">Production validation loop</text>
  <rect class="blue-fill" x="840" y="570" width="128" height="42" rx="8"/>
  <text class="small ink" x="861" y="596">Reprice quotes</text>
  <path class="arrow" d="M972 591h38"/>
  <rect class="teal-fill" x="1014" y="570" width="126" height="42" rx="8"/>
  <text class="small ink" x="1034" y="589">Inspect P, z, f</text>
  <text class="small ink" x="1053" y="604">together</text>
  <path class="arrow" d="M1077 617v28"/>
  <rect class="amber-fill" x="1014" y="650" width="126" height="42" rx="8"/>
  <text class="small ink" x="1030" y="676">Stress endpoints</text>
  <path class="arrow" d="M1010 671h-38"/>
  <rect class="slate-fill" x="840" y="650" width="128" height="42" rx="8"/>
  <text class="small ink" x="856" y="668">Bump &amp; rebuild</text>
  <text class="small ink" x="866" y="684">PV and PV01</text>
  <text class="small muted" x="840" y="719">Version interpolation and extrapolation as model policy.</text>
</svg>
